<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- Font Awesome CSS-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Colby International Office Form Helper</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark pb-4" style="background: #2463A1;">
        <div class="container">
            <a class="navbar-brand" href="{{url_for ('task')}}"><img src="../static/images/IntLogo.jpg" width=200 height=70 /></a>
            <button class="btn nav-item">
                <i class="fa fa-sign-out" aria-hidden="true" style="color: white;">
                <a style="color: white" href= "{{url_for ('logout')}}">Log Out</a>
                </i>
            </button>
            <button class="btn nav-item">
                <i class="fa-solid fa-message " style="color: white;"></i>
            </button>
        </div>
    </nav>

    <content class="container row mx-auto mt-4">
      <section class="row container mx-auto mt-2 py-2 text-dark" style="background-color: #6C96BF">

        <div class="container-fluid my-3">
          <div class="row">
                  <h1 class="display-5 fw-bold">Add Task</h1>
                  <form class="col-lg-5">
                    <div class="form-group fs-1 mb-4">
                      <label for="exampleFormControlInput1">Task Name:</label>
                      <input type="text" class="form-control"  placeholder="Get SSN Number">
                      <label for="exampleFormControlInput1">Deadline:</label>
                      <input type="date" class="form-control"  placeholder="Deadline">
                    </div>
                    <ol class="list-group list-group-flush" id="subtask-list">
                      <li class="list-group-item"  style="background-color: #C7D9E0;">
                        <div class="form-group fs-3 mb-4">
                          <label>Sub-Task Title:</label>
                          <input type="text" class="form-control" placeholder="Find an on campus job">
                        </div>

                        <ul class="list-group step-list">
                          <li class="list-group-item">
                            <div class="form-group fs-5 mb-4">
                              <label>Step Title:</label>
                              <input type="text" class="form-control" placeholder="Setup your workday account">
                            </div>
                            <div class="form-group mb-3">
                              <label>Example textarea</label>
                              <textarea class="form-control" rows="3"></textarea>
                            </div>
                          </li>
                        </ul>
                        <button type="button" class="btn btn-success add-step-btn mt-2" onclick="addStep(this.closest('.list-group-item').querySelector('.step-list'))">Add Step</button>
                        <button type="button" class="btn btn-danger delete-step-btn mt-2" onclick="deleteStep(this.closest('.list-group-item').querySelector('.step-list'))">Delete Step</button>
                        
                      </li>
                    </ol>
                    <button type="button" onclick="addSubtask()" class="btn btn-success mt-2">Add Sub-Task</button>
                    <button type="button" onclick="deleteSubtask()" id="deleteSubtaskBtn" class="btn btn-danger mt-2">Delete Sub-Task</button>
                    <button type="submit" class="btn btn-primary mt-2">Submit</button>  
                  </form>
                  <br>

          </div>
        </div>
      </section>
    </content>

    


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
  crossorigin="anonymous"></script>
</body>
<script>
  function addStep(stepList) {
    const newStep = stepList.firstElementChild.cloneNode(true);

    // Clear input fields in the new step
    newStep.querySelectorAll("input, textarea").forEach(input => input.value = "");

    stepList.appendChild(newStep);
  }

  function deleteStep(stepList) {
    if (stepList.children.length > 1) {
      stepList.removeChild(stepList.lastElementChild);
    }
  }

  function addSubtask() {
    const subtaskList = document.getElementById("subtask-list");
    const newSubtask = subtaskList.firstElementChild.cloneNode(true);

    // Clear input fields in the new subtask
    newSubtask.querySelectorAll("input, textarea").forEach(input => input.value = "");

    // Find and reset the step list within the new subtask
    const stepList = newSubtask.querySelector(".step-list");
    stepList.innerHTML = ""; // Clear all existing steps

    // Create a fresh, blank step for the new subtask
    const initialStep = document.createElement("li");
    initialStep.className = "list-group-item";
    initialStep.innerHTML = `
      <div class="form-group fs-5 mb-4">
        <label>Step Title:</label>
        <input type="text" class="form-control" placeholder="Enter step title">
      </div>
      <div class="form-group mb-3">
        <label>Example textarea</label>
        <textarea class="form-control" rows="3"></textarea>
      </div>
    `;
    stepList.appendChild(initialStep);

    // Update buttons to call addStep and deleteStep with the specific step list
    newSubtask.querySelector(".add-step-btn").onclick = () => addStep(stepList);
    newSubtask.querySelector(".delete-step-btn").onclick = () => deleteStep(stepList);

    // Append the new subtask to the list
    subtaskList.appendChild(newSubtask);
  }

  function deleteSubtask() {
    const subtaskList = document.getElementById("subtask-list");

    if (subtaskList.children.length > 1) {
      subtaskList.removeChild(subtaskList.lastElementChild);
    }
  }
</script>

</html>
