<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- Font Awesome CSS-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Colby International Office Form Helper</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark pb-4" style="background: #2463A1;">
        <div class="container">
            <a class="navbar-brand" href="{{url_for ('task')}}"><img src="../static/images/IntLogo.jpg" width=200 height=70 /></a>
            <button class="btn nav-item">
                <i class="fa fa-sign-out" aria-hidden="true" style="color: white;">
                <a style="color: white" href= "{{url_for ('logout')}}">Log Out</a>
                </i>
            </button>
            <button class="btn nav-item">
                <i class="fa-solid fa-message " style="color: white;"></i>
            </button>
        </div>
    </nav>

    <content class="container row mx-auto mt-4">
      <section class="row container mx-auto mt-2 py-2 text-dark" style="background-color: #6C96BF">

        <div class="container-fluid my-3">
          <div class="row">
                  <h1 class="display-5 fw-bold">Add Task</h1>
                  <form class="col-lg-5">
                    <div class="form-group fs-1 mb-4">
                      <label for="exampleFormControlInput1">Task Name:</label>
                      <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Get SSN Number">
                      <label for="exampleFormControlInput1">Deadline:</label>
                      <input type="date" class="form-control" id="exampleFormControlInput1" placeholder="Deadline">
                    </div>
                    <ol class="list-group list-group-flush">
                      <li class="list-group-item"  style="background-color: #C7D9E0;">
                        <div class="form-group fs-3 mb-4">
                          <label for="exampleFormControlInput1">Sub-Task Title:</label>
                          <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Find an on campus job">
                        </div>
                        <ul class="list-group list-group">
                          <li class="list-group-item">
                            <div class="form-group fs-5 mb-4">
                              <label for="exampleFormControlInput1">Step Title:</label>
                              <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Setup your workday account">
                            </div>
                            <div class="form-group mb-3">
                              <label for="exampleFormControlTextarea1">Example textarea</label>
                              <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                            </div>
                          </li>
                        </ul>
                        <button type="submit" class="btn btn-success">Add Step</button>
                            <button type="submit" class="btn btn-danger disabled">Delete Step</button>
                      </li>
                    </ol>
                    <button type="submit" class="btn btn-success">Add Sub-Task</button>
                    <button type="submit" class="btn btn-danger disabled">Delete Sub-Task</button>
                    
                  </form>
                  <br>
                  <!--<a href="facts.html" class="btn btn-dark" style="margin-left: 73%; background-color: #0A1626">What does this button do?</a>-->
          </div>
        </div>
      </section>
    </content>

    


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
  crossorigin="anonymous"></script>
</body>
