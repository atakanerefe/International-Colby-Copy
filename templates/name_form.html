<!--Create form that takes in name and adds it to user's name column in db. Use bootstrap-->
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- Font Awesome CSS-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Colby International Office Form Helper</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark pb-4" style="background: #2463A1;">
        <div class="container">
            <a class="navbar-brand" href="{{url_for ('task')}}"><img src="../static/images/IntLogo.jpg" width=200 height=70 /></a>
            <button class="btn nav-item">
                <i class="fa fa-sign-out" aria-hidden="true" style="color: white;">
                <a style="color: white" href= "{{url_for ('logout')}}">Log Out</a>
                </i>
            </button>
            <button class="btn nav-item">
                <i class="fa-solid fa-message " style="color: white;"></i>
            </button>
        </div>
    </nav>

    <content class="container row mx-auto mt-4">
        <h5 class="text-center h2 pb-4">Welcome, student! Please sign in to view your tasks.</h5>
        <form action="{{url_for('name_form')}}" method="POST">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Enter your name">
            </div>
            <!--tie the submit button to adding item to name field of db-->
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </content>
</body>
</html>
