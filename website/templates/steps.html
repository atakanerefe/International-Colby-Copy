<!DOCTYPE html>
<html lang="en">
<head>
    {% include 'bootstrapStarter.html' %}
</head>

<body>
    {% include 'navbar.html' %}

    <content class="container row mx-auto mt-4">
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-2">
                    <ul class="list-group">
                      <!-- vertical sidebar with hardcoded length of subtask -->
                        {% for i in range(1,steps|length+1) %}
                            <li class="list-group-item {% if i == active_step %}active{% endif %}" 
                                id="step-{{ i }}">{{ i }}
                            </li>
                        {% endfor %}
                    </ul>
                </div>
    
                <div class="col-md-10">
                  <!-- card for the subtask content -->
                    <div class="card mb-4" id="step-card">
                        <div class="card-header">Step {{ active_step }}</div>
                        <div class="card-body">
                            <h5 class="card-title">Step Description Title for Step {{ active_step }}</h5>
                            <p class="card-text">Detailed description of step {{ active_step }} goes here...</p>
                        </div>
                    </div>

                    <input type="hidden" id="steps-data" value='{{ steps|tojson }}'>
                    <input type="hidden" id="active-step-data" value="{{ active_step }}">
    
                    <div class="d-flex justify-content-center mt-4">

                        <a style="display: none" href="#" onclick="decrementStep()" class="btn btn-dark" id="previous-btn">Previous</a>

                        <a style="display: block" href='#' onclick="incrementStep()" class="btn btn-dark ml-2" id="next-btn">Next</a>

                        <a style="display: none" href="{{ url_for('main.progress', subtask_id=steps[0]['subtask_id']) }}" class="btn btn-dark ml-2" id="submit-btn">Submit</a>
    
                    </div>
                </div>
            </div>
        </div>
    </content>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous">
    </script>

    <script src="{{ url_for('static', filename='changeStep.js') }}"></script>

</body>


</html>
