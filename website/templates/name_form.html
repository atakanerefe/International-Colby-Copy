<!--Create form that takes in name and adds it to user's name column in db. Use bootstrap-->
<!DOCTYPE html>
<html lang="en">
<head>
    {% include 'bootstrapStarter.html' %}
</head>

<body>
    {% include 'navbar.html' %}

    <content class="container row mx-auto mt-4">
        <h5 class="text-center h2 pb-4">Welcome, {{ email }}! Please sign in to view your tasks.</h5>
        <form action="{{url_for('auth.finish_login')}}" method="post">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Enter your name">
            </div>
            <!--box for id entry-->
            <div class="form-group">
                <label for="student_id">ID</label>
                <input type="text" class="form-control" id="student_id" name="student_id" placeholder="Enter your ID">
            </div>
            <!-- Hidden input to pass the email -->
            <input type="hidden" name="email" value="{{ email }}">
            <!--tie the submit button to adding item to name field of db-->
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </content>
</body>
</html>
