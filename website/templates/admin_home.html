<!doctype html>
<html lang="en">

<head>
    {% include 'bootstrapStarter.html' %}

</head>

<body>
    {% include 'navbar.html' %}

    <content class="container row mx-auto mt-4">
        <h5 class="text-center h2 pb-4" id="welcome-message">Welcome, Admin!</h5>
        <content class="container row mx-auto mt-4">
            <div class="btn-toolbar justify-content-between">
                <div class="dropdown">
                    <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton1" data-bs-toggle="dropdown" aria-expanded="false">
                        Select Task
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton1">
                        <!-- Change this to call fetchTasks with a sample email for each task -->
                        <li><a class="dropdown-item" href="#" onclick="fetchStudents('First Year Check In')">First Year Check In</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="{{url_for ('main.addTask')}}">Create New Task</a></li>
                    </ul>
                </div>
                <div class="dropdown">
                    <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton1" data-bs-toggle="dropdown" aria-expanded="false">
                        Task Editing
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton1">
                        <li><a class="dropdown-item" href="{{url_for ('main.addTask')}}">Create New Task</a></li>
                        <li><a class="dropdown-item" href="#">Edit Existing Task</a></li>
                    </ul>
                </div>
            </div>  
            <!--student search bar-->
            <div class="m-auto col-md-3">
                <div class="dropdown">
                    <button class="btn btn-secondary dropdown-toggle" type="button" id="searchTypeButton" data-bs-toggle="dropdown" aria-expanded="false">
                        Dropdown
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="searchTypeButton">
                        <li><h6 class="dropdown-header">Dropdown header</h6></li>
                        <li><a class="dropdown-item" href="#">Action</a></li>
                        <li><a class="dropdown-item" href="#">Another action</a></li>
                        <li><a class="dropdown-item" href="#">Something else here</a></li>
                    </div>
                </div>
            </div>
            <!-- <div class="m-auto col-md-4">
                <label for="exampleDropdownFormEmail1">Student Search</label>
                <input type="email" class="form-control" id="exampleDropdownFormEmail1" placeholder="student name">
                <button type="submit" class="btn btn-primary mt-2" onclick="fetchTasks(document.getElementById('exampleDropdownFormEmail1').value)">Search</button>
            </div> -->
        </content>

        <content class="container row mx-auto mt-4" id="studentCardsContainer">
            <!-- Student progress cards will be dynamically added here -->
        </content>
        
    </content>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous">
    </script>

    <!-- javaScript to fetch students and display them dynamically -->
    <script src="{{ url_for('static', filename='adminPageStudentProgress.js') }}"></script>

</body>

</html>
