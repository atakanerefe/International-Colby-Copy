<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    <title>Student Progress</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark pb-4" style="background: #2463A1;">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('task') }}"><img src="../static/images/IntLogo.jpg" width="200" height="70" alt="Logo" /></a>
            <button class="btn nav-item">
                <i class="fa fa-sign-out" aria-hidden="true" style="color: white;">
                    <a style="color: white" href="{{ url_for('logout') }}">Log Out</a>
                </i>
            </button>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Student & Task Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="mb-2">Student: {{ student.email }}</h4>
                <h5>Task: {{ task.title }}</h5>
            </div>
            <!-- Progress bar -->
            <div class="progress w-50">
                <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" 
                     style="width: {{ progress_percent }}%" aria-valuenow="{{ progress_percent }}" aria-valuemin="0" aria-valuemax="100">
                    {{ progress_ratio }} subtasks completed
                </div>
            </div>
        </div>

        <!-- Subtasks Progress Cards -->
        <div class="row">
            {% for subtask in subtasks %}
            <div class="col-lg-4 col-md-6 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <div class="d-flex justify-content-between">
                            <span class="subtask-title">{{ subtask.subtask }}</span>
                            <span class="{{ 'status-complete' if subtask.status == 'complete' else 'status-incomplete' }}">
                                {{ subtask.status.capitalize() }}
                            </span>
                        </div>
                    </div>
                    <div class="card-body">
                        <p>{{ subtask.description }}</p>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
