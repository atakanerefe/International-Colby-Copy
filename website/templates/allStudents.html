<html lang="en">
<title>Colby International Office Form Helper</title>

    {% include 'bootstrapStarter.html' %}

<body>
    {% include 'navbar.html' %}

    <content class="container row mx-auto mt-4">
        <!-- <h2 class="mb-4" id="welcome-message">Admin Dashboard</h2> -->
        <div class="d-flex align-items-center justify-content-between gap-3 m-6 mt-4">
            <!-- creating a tag label for student view that should be uneditable -->
            <h5 class="text-start h2 mb-0"id="welcome-message">Admin Dashboard</h5>
            <!-- <div class="m-auto col-lg-3 text-center card" style="background: #C7D9E0;"> -->
            <div class="d-flex align-items-center" studentName="{{ student.name }}">
                <button class="btn btn-secondary m-1" id="editTaskButton" disabled>Edit Task</button>
                <a class="btn btn-primary m-1" id="addTaskButton" href = "{{ url_for('main.addTask') }}">New Task</a>
                <button class="btn btn-primary m-1" id="addLabelButton" data-bs-toggle="modal" data-bs-target="#labelModal">New Label</button>

            </div>
        </div>
        <div class="my-4 justify-content-between">
            <div class=" row mb-4">

                <!-- Search Section -->
                <div class="col-lg-4">
                    <div class="input-group m-1">
                        <select class="form-select" id="searchDropdown">
                            <option value="" selected>-- Search by: --</option>
                            <option value="name">First Name</option>
                            <option value="lastName">Last Name</option>
                            <option value="email">Email</option>
                            <option value="id">ID</option>
                        </select>
                        <input type="text" class="form-control" id="searchInput" placeholder="Search...">
                        <!-- Reset Button -->
                    </div>
                    <div class="input-group m-1">
                        <!-- Dropdown to display task options dynamically -->
                        <select class="form-select" id="taskFilter" onchange="handleTaskSelection()">
                            <option value="" selected>-- Filter by Task --</option>
                            <!-- tasks will be dynamically added here via JavaScript -->
                        </select>
                        <!-- Dropdown to display tag options dynamically -->
                        <select class="form-select" id="tagFilter" onchange="handleTagSelection()">
                            <option value="" selected>-- Filter by Tag --</option>
                            <!-- tasks will be dynamically added here via JavaScript -->
                        </select>
                    </div>
                    
                    <!-- <div class="input-group m-1">
                        <select class="form-select" id="tagOrTaskToggle" onchange="">
                            <option value="" selected>-- Select Task or Tag --</option>
                            <option value="">Filter by task</option>
                            <option value="">Filter by tag</option>
                        </select>       -->
                        <!-- DYNAMICALLY DISPLAY TASKS -->
                        <!-- <select class="form-select" id="filterType" onchange="handleTaskSelection()">
                            <option value="" selected>-- Select Task --</option>
                            {% for task in tasks %}
                                <option value="{{ task.title }}">{{ task.title }}</option>
                            {% endfor %}
                        </select>      
                    </div> -->
                    <button class="btn btn-secondary m-1" id="resetFilters">Reset Filters</button>
                </div> 
                <!-- end of column ^^^ -->

                <div class="col-lg-1">
                </div>

                <div class="col-lg-7">
                    <div class="input-group m-1">
                        <select class="form-select" id="assignRemoveToggle" onchange="">
                            <option value="" selected>-- Assign / Remove --</option>
                            <option value="">Assign</option>
                            <option value="">Remove</option>
                        </select>      
                        <select class="form-select" id="tagOrTask" onchange="">
                            <option value="" selected>-- Task or Tag --</option>
                            <option value="Task">Task</option>
                            <option value="Tag">Tag</option>
                        </select>      
                        <!-- DYNAMICALLY DISPLAY TASKS -->
                        <select class="form-select" id="assignOrRemoveItemName" onchange="">
                            <option value="" selected>-- select task or tag --</option>
                            {% for task in tasks %}
                                <option value="{{ task.title }}">{{ task.title }}</option>
                            {% endfor %}
                        </select>      
                    </div>
                    <div class="input-group m-1">
                        <button class="btn btn-success m-1 ms-auto" id="submitAssignOrRemove" disabled>Submit</button>
                    </div>
                </div>




                <!-- <div class="col-lg-1">
                    <button class="btn btn-success m-1" id="submitAssignOrRemove" disabled>Submit</button>
                </div> -->

                <!-- Task Management Section -->
                <!-- <div class="col-lg-4">
                    <div>
                        <button class="btn btn-success m-1" id="assignTaskButton" disabled>Assign</button>
                        <button class="btn btn-danger m-1" id="removeTaskButton" disabled>Remove</button>
                    </div>
                </div> -->
                
            
                <!-- Labels Management Section -->
                <!-- <div class="col-lg-4">
                    <div>
                        <select class="form-select m-1" id="labelsDropdown">
                            <option value="" selected>-- Select Label --</option>
                            <option value="Co'25"><span class="badge bg-success m-1">Co'25</span></option>
                            <option value="Co'26"><span class="badge bg-success m-1">Co'26</span></option>
                            <option value="OPT"><span class="badge bg-warning text-dark">OPT</span></option>
                        </select>
                        
                        <button class="btn btn-success m-1" id="assignLabelButton" disabled>Assign</button>    
                        <button class="btn btn-danger m-1" id="removeLabelButton" disabled>Remove</button>    
                    </div>                        
                </div> -->
            </div>
            
            <!-- Modal for Adding Labels -->
            <div class="modal fade" id="labelModal" tabindex="-1" aria-labelledby="labelModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                    <h5 class="modal-title" id="labelModalLabel">Add Label</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                    <form id="labelForm">
                        <div class="mb-3">
                        <label for="labelName" class="form-label">Label Name</label>
                        <input type="text" class="form-control" id="labelName" placeholder="Enter label name" required>
                        </div>
                        <div class="mb-3">
                        <label for="labelColor" class="form-label">Select Color</label>
                        <select class="form-select" id="labelColor">
                            <option value="bg-primary">Blue</option>
                            <option value="bg-secondary">Gray</option>
                            <option value="bg-success">Green</option>
                            <option value="bg-danger">Red</option>
                            <option value="bg-warning text-dark">Yellow</option>
                            <option value="bg-info">Cyan</option>
                            <option value="bg-dark text-light">Black</option>
                        </select>
                        </div>
                    </form>
                    </div>
                    <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveLabelButton"  data-bs-dismiss="modal">Save Label</button>
                    </div>
                </div>
                </div>
            </div>
  


        


            <div class="table-responsive">
                <table class="table table-striped table-bordered table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>
                                <input type="checkbox" id="selectAll" />
                            </th>
                            <th>Colby ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Email</th>
                            <th>Labels</th>
                            <th>Tasks</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td><input type="checkbox" class="row-checkbox" /></td>
                            <td>11111</td>
                            <td>Student</td>
                            <td>Example</td>
                            <td>student@colby.edu</td>
                            <td><span class="badge bg-success m-1">Co'26</span><span class="badge bg-warning text-dark">OPT</span></td>
                            <td>
                                <a href="">2/2</a>
                            </td>
                        </tr>
                        <tr>
                            <td><input type="checkbox" class="row-checkbox" /></td>
                            <td>434343</td>
                            <td>Atakan</td>
                            <td>Erefe</td>
                            <td>aerefe26@colby.edu</td>
                            <td><span class="badge bg-success m-1">Co'25</span></td>
                            <td>
                                <a href="">3/5</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </content>
